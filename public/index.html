<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musix — Cloud Drive Streamer</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root { --bg-main: #090d16; --bg-card: #131b2e; --bg-hover: #1e293b; --accent: #10b981; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #1e293b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 110px; min-height: 100vh; }
    header { background: rgba(19, 27, 46, 0.9); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .nav-tabs { display: flex; gap: 0.5rem; background: var(--bg-main); padding: 0.35rem; border-radius: 0.75rem; border: 1px solid var(--border); }
    .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #052e16; }
    main { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .toolbar { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
    .search-input { flex: 1; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 0.7rem 1rem; border-radius: 0.6rem; }
    .song-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .song-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.85rem 1.1rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .song-item:hover { background: var(--bg-hover); }
    .song-item.playing { border-color: var(--accent); background: rgba(16, 185, 129, 0.1); }
    .song-info { display: flex; align-items: center; gap: 0.9rem; }
    .song-title { font-weight: 600; }
    .song-meta { color: var(--text-muted); font-size: 0.8rem; }
    .btn-small { background: var(--accent); color: #052e16; border: none; padding: 0.4rem 0.75rem; border-radius: 0.5rem; font-weight: 700; cursor: pointer; }
    .upload-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; max-width: 540px; margin: 1rem auto; }
    .form-group { margin-bottom: 1.25rem; }
    .form-input { width: 100%; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 0.75rem; border-radius: 0.6rem; }
    .drop-zone { border: 2px dashed var(--border); border-radius: 0.75rem; padding: 2rem 1rem; text-align: center; cursor: pointer; }
    .submit-btn { width: 100%; background: var(--accent); color: #052e16; border: none; padding: 0.85rem; border-radius: 0.6rem; font-weight: 700; cursor: pointer; }
    .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.96); border-top: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .player-controls { flex: 1; max-width: 550px; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .ctrl-btn { background: none; border: none; color: var(--text-main); font-size: 1.1rem; cursor: pointer; }
    .ctrl-btn.play-main { background: var(--accent); color: #052e16; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="logo">♫ Musix Cloud</div>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('library')">My Drive Library</button>
      <button class="tab-btn" onclick="switchTab('trending')">Weekly Trending</button>
      <button class="tab-btn" onclick="switchTab('upload')">+ Upload Song</button>
    </nav>
  </header>

  <main>
    <section id="view-library" class="view-section active">
      <div class="toolbar">
        <input type="text" id="library-search" class="search-input" placeholder="Search songs..." oninput="renderLibrary()" />
        <button class="btn-small" onclick="fetchLibrary()">↻ Refresh Drive</button>
      </div>
      <div id="library-list" class="song-list"><p>Loading your songs...</p></div>
    </section>

    <section id="view-trending" class="view-section">
      <div class="toolbar">
        <div class="nav-tabs">
          <button id="btn-india" class="tab-btn active" onclick="setTrendingRegion('india')">India Top 25</button>
          <button id="btn-global" class="tab-btn" onclick="setTrendingRegion('global')">Global Top 25</button>
        </div>
        <button class="btn-small" onclick="fetchTrending()">↻ Check</button>
      </div>
      <div id="trending-list" class="song-list"><p>Fetching charts...</p></div>
    </section>

    <section id="view-upload" class="view-section">
      <div class="upload-card">
        <h2>Upload Track</h2>
        <form id="upload-form" onsubmit="handleUpload(event)">
          <div class="form-group">
            <input type="text" id="song-title" class="form-input" placeholder="Song Title & Artist" required />
          </div>
          <div class="form-group">
            <div class="drop-zone" onclick="document.getElementById('audio-file').click()">
              <p id="file-label">Click to choose an audio file</p>
              <input type="file" id="audio-file" accept="audio/*" style="display: none;" onchange="handleFileSelect(event)" required />
            </div>
          </div>
          <button type="submit" id="upload-submit-btn" class="submit-btn">Upload to Drive</button>
          <p id="upload-status" style="margin-top: 1rem; text-align: center;"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="player-bar">
    <div>
      <div id="now-title" style="font-weight:700">No track selected</div>
      <div id="now-status" style="font-size:0.75rem; color:var(--accent)">Ready</div>
    </div>
    <div class="player-controls">
      <div style="display:flex; gap:1.25rem;">
        <button class="ctrl-btn" onclick="playPrevSong()">⏮</button>
        <button id="play-pause-btn" class="ctrl-btn play-main" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="playNextSong()">⏭</button>
      </div>
    </div>
    <audio id="audio-player"></audio>
  </footer>

  <script>
    let driveSongs = [];
    let trendingData = { indiaTrending: [], globalTrending: [] };
    let currentRegion = 'india';
    let currentSongIndex = -1;
    const audioPlayer = document.getElementById('audio-player');
    const playPauseBtn = document.getElementById('play-pause-btn');

    function switchTab(tab) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('header .tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`view-${tab}`).classList.add('active');
      const idx = tab === 'library' ? 0 : tab === 'trending' ? 1 : 2;
      document.querySelectorAll('header .tab-btn')[idx].classList.add('active');
      if (tab === 'trending' && trendingData.indiaTrending.length === 0) fetchTrending();
    }

    async function fetchLibrary() {
      try {
        const res = await fetch('/api/songs');
        driveSongs = await res.json();
        renderLibrary();
      } catch (err) {
        document.getElementById('library-list').innerHTML = `<p style="color:red">Failed to load Drive.</p>`;
      }
    }

    function renderLibrary() {
      const container = document.getElementById('library-list');
      const query = document.getElementById('library-search').value.toLowerCase();
      const filtered = driveSongs.filter(s => s.name.toLowerCase().includes(query));
      
      container.innerHTML = filtered.map((song, idx) => `
        <div class="song-item ${driveSongs[currentSongIndex]?.id === song.id ? 'playing' : ''}" onclick="playById('${song.id}')">
          <div class="song-info">
            <span style="width:24px">${idx + 1}</span>
            <div>
              <div class="song-title">${song.name}</div>
              <div class="song-meta">Google Drive Stream</div>
            </div>
          </div>
          <button class="btn-small">▶ Play</button>
        </div>
      `).join('');
    }

    function playById(fileId) {
      currentSongIndex = driveSongs.findIndex(s => s.id === fileId);
      const song = driveSongs[currentSongIndex];
      audioPlayer.src = `/api/stream/${song.id}`;
      audioPlayer.play();
      document.getElementById('now-title').textContent = song.name;
      document.getElementById('now-status').textContent = 'Streaming';
      playPauseBtn.textContent = '⏸';
      renderLibrary();
    }

    function togglePlay() {
      if (!audioPlayer.src && driveSongs.length > 0) return playById(driveSongs[0].id);
      if (audioPlayer.paused) { audioPlayer.play(); playPauseBtn.textContent = '⏸'; }
      else { audioPlayer.pause(); playPauseBtn.textContent = '▶'; }
    }

    function playNextSong() {
      if (driveSongs.length === 0) return;
      playById(driveSongs[(currentSongIndex + 1) % driveSongs.length].id);
    }

    function playPrevSong() {
      if (driveSongs.length === 0) return;
      playById(driveSongs[(currentSongIndex - 1 + driveSongs.length) % driveSongs.length].id);
    }

    audioPlayer.addEventListener('ended', playNextSong);

    async function fetchTrending() {
      try {
        const res = await fetch('/api/trending');
        trendingData = await res.json();
        renderTrending();
      } catch (err) {
        document.getElementById('trending-list').innerHTML = `<p style="color:red">Error fetching charts.</p>`;
      }
    }

    function setTrendingRegion(region) {
      currentRegion = region;
      document.getElementById('btn-india').classList.toggle('active', region === 'india');
      document.getElementById('btn-global').classList.toggle('active', region === 'global');
      renderTrending();
    }

    function renderTrending() {
      const list = currentRegion === 'india' ? trendingData.indiaTrending : trendingData.globalTrending;
      document.getElementById('trending-list').innerHTML = list.map(item => `
        <div class="song-item">
          <div class="song-info">
            <span style="width:24px">#${item.rank}</span>
            <div><div class="song-title">${item.title}</div><div class="song-meta">${item.artist}</div></div>
          </div>
        </div>
      `).join('');
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) document.getElementById('file-label').textContent = file.name;
    }

    async function handleUpload(event) {
      event.preventDefault();
      const fileInput = document.getElementById('audio-file');
      const titleInput = document.getElementById('song-title');
      const btn = document.getElementById('upload-submit-btn');
      const status = document.getElementById('upload-status');

      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('title', titleInput.value);
      formData.append('audio', fileInput.files[0]);

      btn.disabled = true;
      btn.textContent = 'Uploading...';
      status.textContent = 'Streaming to Google Drive...';

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        status.textContent = `✓ Uploaded!`;
        status.style.color = '#34d399';
        document.getElementById('upload-form').reset();
        await fetchLibrary();
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        status.style.color = '#ef4444';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload to Drive';
      }
    }

    fetchLibrary();
  </script>
</body>
</html>
